version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Pinned to keep Node 22.0.0 support
      - dependency-name: "jsdom"
        versions: [">=27"]
      - dependency-name: "vitest"
        versions: [">=4"]
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=4"]
      - dependency-name: "eslint"
        versions: [">=10"]
      # typescript-eslint rejects TS 7.0
      - dependency-name: "typescript"
        versions: [">=7"]
        

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
