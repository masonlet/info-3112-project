name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.0.0', '22', '24', '26']

    steps:
      - uses: masonlet/looking-for-love/.github/actions/setup@main
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Linter
        run: npm run lint
